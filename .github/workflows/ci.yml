name: CI

# Sur master, la CI est lancée par le workflow de déploiement (workflow_call),
# qui ne déploie que si elle passe.
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (Laravel, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gmp / bcmath : chiffrement des notifications push (Web Push)
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gmp, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests (Pest)
        run: php artisan test

      - name: Audit des dépendances PHP (informatif)
        continue-on-error: true
        run: composer audit

  # Mêmes tests contre MySQL 8, comme en production.
  backend-mysql:
    name: Backend (Laravel, MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: planning_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: planning_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gmp, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Pest, MySQL)
        run: php artisan test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

      - name: Audit des dépendances JS (informatif)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
